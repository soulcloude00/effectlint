name: Security
on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: action/package-lock.json}
      - run: npm ci
        working-directory: action
      - run: npm audit --audit-level=high
        working-directory: action
