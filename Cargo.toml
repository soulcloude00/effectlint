[package]
name = "effectlint"
version = "0.1.0"
edition = "2021"
description = "Detect newly introduced effects and authority in agent configuration"
license = "Apache-2.0"
repository = "https://github.com/haresh-k/effectlint"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.12"
